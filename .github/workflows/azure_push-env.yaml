# .github/workflows/upload-file-to-blob.yaml
name: Upload File(s) to Azure Blob Storage

on:
    # Trigger on a push to a specific branch if the commit message contains 'updateenv'
    push:
        branches:
            - main # Or your primary branch
        paths:
            - "**" # You might want to restrict this to specific paths if needed
        # Add the condition to check the commit message
        # Note: This condition applies to the entire push event, not just individual commits within the push

jobs:
    upload_files:
        if: contains(github.event.head_commit.message, 'pushenv')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # --- Login to Azure ---
            # Uses the same secret format as your deploy workflow
            - name: Log in to Azure
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS_JSON }}

            # --- Upload Files to Azure Blob Storage ---
            - name: Upload specified files to Azure Blob Storage
              uses: azure/cli@v2
              with:
                  inlineScript: |
                      # Install jq to parse JSON
                      sudo apt-get update
                      sudo apt-get install -y jq

                      # Get the JSON string of file paths from secrets
                      FILE_LIST_JSON='${{ secrets.LOCAL_FILES_TO_UPLOAD_JSON }}'
                      AZURE_ROOT_PATH='${{ secrets.AZURE_BLOB_STORAGE_CONTAINER_ROOT_PATH }}'
                      AZURE_CONTAINER_NAME='${{ secrets.AZURE_BLOB_CONTAINER_NAME }}'
                      AZURE_STORAGE_ACCOUNT_NAME='${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}'

                      # Parse the JSON array and iterate through each file path
                      echo "$FILE_LIST_JSON" | jq -c '.[]' | while read file_path; do
                        # Remove quotes from the file path
                        clean_file_path=$(echo "$file_path" | tr -d '"')

                        # Extract the filename from the path
                        filename=$(basename "$clean_file_path")

                        # Construct the destination blob path
                        # Ensure there's a '/' between the root path and the filename if the root path is not empty
                        if [ -z "$AZURE_ROOT_PATH" ]; then
                          destination_blob_path="$filename"
                        else
                          destination_blob_path="$AZURE_ROOT_PATH/$filename"
                        fi


                        echo "Uploading $clean_file_path to blob $destination_blob_path in container $AZURE_CONTAINER_NAME"

                        # Upload the file
                        az storage blob upload \
                          --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
                          --container-name "$AZURE_CONTAINER_NAME" \
                          --file "$clean_file_path" \
                          --name "$destination_blob_path" \
                          --auth-mode login # Use 'login' because we authenticated with azure/login

                        # Check if the upload was successful
                        if [ $? -ne 0 ]; then
                          echo "Error uploading $clean_file_path. Aborting."
                          exit 1
                        fi
                      done

            # --- Logout ---
            - name: Azure logout
              run: |
                  az logout
                  az cache purge
                  az account clear
              if: always() # Ensure logout happens even if previous steps fail
